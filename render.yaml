services:
  - type: web
    name: tor2vid
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MAX_TORRENTS
        value: "2"
      - key: MAX_CONNS
        value: "30"
      - key: IDLE_MINUTES
        value: "20"
      - key: TRANSCODE_MAX_HEIGHT
        value: "480"
      - key: TRANSCODE_PRESET
        value: ultrafast
      - key: MAX_TRANSCODES
        value: "1"

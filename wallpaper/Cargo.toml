[package]
name = "zhivye-oboi"
version = "0.1.1"
edition = "2021"
description = "Живые обои для Windows: видео, анимация и звук на рабочем столе"
license = "ISC"
publish = false

[[bin]]
name = "zhivye-oboi"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
libloading = "0.9"
dirs = "6"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "glow", "default_fonts"] }
egui_extras = { version = "0.37", features = ["file", "image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
raw-window-handle = "0.6"
rfd = "0.18"
tray-icon = "0.26"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
] }

[target.'cfg(windows)'.build-dependencies]
embed-manifest = "1.5"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
